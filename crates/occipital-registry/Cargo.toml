[package]
name = "cortexkit-occipital-registry"
version = "0.1.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tool templates for the CortexKit apps: the occipital.template/1 document, its canonical JSON and digest, the checks a tool's view must pass, and the occipital-check command"
readme = "README.md"
keywords = ["cortexkit", "rich-ui", "template", "checker"]
categories = ["command-line-utilities", "development-tools"]
# Only what builds the library and the occipital-check command. The crate's
# tests, vector generator and vectors stay in the repository.
include = ["Cargo.toml", "README.md", "TEMPLATES.md", "LICENSE", "src/**/*.rs"]

[lib]
name = "occipital_registry"

# The apps, including the phone, link this crate, so its normal dependencies
# stay pure Rust, need no C toolchain and perform no I/O.
[dependencies]
# The record schema a view declares, which types a template's `view`.
cortexkit-role-tool-display = "=0.1.3"
# Dependency-free, pure-Rust SHA-256 for template digests on every target,
# the same implementation occipital-lang uses.
hmac-sha256 = { version = "1", default-features = false }
# The language checker a view's templates must pass.
occipital-lang = { package = "cortexkit-occipital-lang", version = "0.1.1", path = "../occipital-lang" }
serde_json = "1"

[[bin]]
name = "occipital-check"
path = "src/bin/occipital-check.rs"
